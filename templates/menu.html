<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú | Café Cult</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <header>
        <nav>
            <h1>Café Cult</h1>
            <div>
                <a href="{{ url_for('inicio') }}">Inicio</a>
                <a href="{{ url_for('menu') }}">Menú</a>
                <a href="{{ url_for('contacto') }}">Contacto</a>
            </div>
        </nav>
    </header>

    <main class="contenedor">
        <section class="titulo-pagina">
            <p class="etiqueta">NUESTRO MENÚ</p>
            <h2>Para acompañar tu momento</h2>
            <p>Opciones simples, ricas y preparadas con cariño.</p>
        </section>

        <section class="productos">
            {% for producto in productos %}
            <article class="producto">
                <div>
                    <h3>{{ producto.nombre }}</h3>
                    <p>{{ producto.descripcion }}</p>
                </div>
                <strong>${{ producto.precio }}</strong>
            </article>
            {% endfor %}
        </section>
    </main>

    <footer>
        <p>© 2026 Café Cult</p>
    </footer>
</body>
</html>
