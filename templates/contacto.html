{% extends 'base.html' %}

{% block title %}Contacto | Café Cultural Escobar{% endblock %}

{% block content %}
<section class="seccion formulario-contenedor">
    <p class="etiqueta">CONTACTO</p>
    <h1>Escribinos</h1>
    <p>¿Tenés una consulta? Dejanos tu mensaje.</p>

    <form action="{{ url_for('contacto') }}" method="post" class="formulario">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" name="nombre" required>

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="6" required></textarea>

        <button type="submit">Enviar mensaje</button>
    </form>
</section>
{% endblock %}
